function showNotes(){const n=(window.PIAFIX_NOTES||[]).find(x=>x.no===current+1);$('#noteNumber').textContent=`BÖLÜM ${current+1} / 20 · KONUŞMACI NOTU`;$('#notesTitle').textContent=slides[current].title;$('#notesBody').innerHTML=n?`${n.talk.map(t=>`<p>${t}</p>`).join('')}<ul>${n.focus.map(t=>`<li>${t}</li>`).join('')}</ul>${current<19?`<div class="transition"><small>SONRAKİ BÖLÜME GEÇERKEN</small>${n.transition}</div>`:''}`:'<p>Bu bölümün ana mesajını kendi sözlerinle anlatabilirsin.</p>';$('#notes').showModal()}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{modal('Tam ekran','<p>Bu tarayıcıda tam ekran açılamadı. Masaüstü tarayıcısında F11 tuşunu kullanabilirsin.</p>')}}
