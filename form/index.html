<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Builder Ön Yüz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body { background-color: #f0f2f5; }
        .form-canvas { min-height: 500px; }
        /* Soru alanlarına tıklandığında veya üzerine gelindiğinde hafif bir vurgu */
        .field-wrapper { border-left: 4px solid transparent; transition: all 0.2s; }
        .field-wrapper:hover { border-left: 4px solid #0d6efd; box-shadow: 0 .125rem .25rem rgba(0,0,0,.075); }
        /* Başlık ve açıklama inputlarını daha şık göstermek için */
        .border-bottom-only {
            border: none;
            border-bottom: 1px solid #ced4da;
            border-radius: 0;
            padding-left: 0;
        }
        .border-bottom-only:focus {
            box-shadow: none;
            border-bottom: 2px solid #0d6efd;
            background-color: transparent;
        }
    </style>
</head>
<body>

<div class="container-fluid mt-4 mb-5">
    <div class="row">
        
        <div class="col-md-3 col-lg-2 mb-3">
            <div class="card shadow-sm sticky-top" style="top: 20px;">
                <div class="card-header bg-white fw-bold">
                    <i class="bi bi-tools"></i> Araç Kutusu
                </div>
                <div class="card-body p-2">
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-secondary text-start btn-add-field" data-type="text">
                            <i class="bi bi-fonts me-2"></i> Kısa Metin
                        </button>
                        <button class="btn btn-outline-secondary text-start btn-add-field" data-type="textarea">
                            <i class="bi bi-text-paragraph me-2"></i> Uzun Metin
                        </button>
                        <button class="btn btn-outline-secondary text-start btn-add-field" data-type="select">
                            <i class="bi bi-menu-button-wide me-2"></i> Açılır Liste
                        </button>
                        <button class="btn btn-outline-secondary text-start btn-add-field" data-type="checkbox">
                            <i class="bi bi-check2-square me-2"></i> Onay Kutusu
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-9 col-lg-8">
            <div class="card shadow form-canvas border-top-0 border-end-0 border-bottom-0 border-primary border-5">
                <div class="card-body p-4 pt-5">
                    
                    <div class="mb-4">
                        <input type="text" class="form-control form-control-lg border-bottom-only fw-bold fs-3 mb-2" placeholder="Form Başlıksız" value="Müşteri Geri Bildirim Formu" id="mainFormTitle">
                        <input type="text" class="form-control border-bottom-only text-muted" placeholder="Form açıklaması ekleyin" id="mainFormDesc">
                    </div>

                    <div id="fieldsContainer">
                        </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
    const fieldsContainer = document.getElementById('fieldsContainer');
    const addButtons = document.querySelectorAll('.btn-add-field');

    // Sol menüdeki butonlara tıklama
    addButtons.forEach(button => {
        button.addEventListener('click', function() {
            const fieldType = this.getAttribute('data-type');
            addFieldToCanvas(fieldType);
        });
    });

    // Event Delegation: Dinamik eklenen butonlar için (Seçenek Ekle / Seçenek Sil)
    fieldsContainer.addEventListener('click', function(e) {
        // Seçenek Sil butonuna tıklandıysa
        if (e.target.closest('.btn-remove-option')) {
            const optionRow = e.target.closest('.option-row');
            const optionsContainer = optionRow.parentElement;
            // Ekranda en az 1 seçenek kalmasını sağla
            if (optionsContainer.querySelectorAll('.option-row').length > 1) {
                optionRow.remove();
            } else {
                alert("En az bir seçenek bulunmalıdır!");
            }
        }

        // Seçenek Ekle butonuna tıklandıysa
        if (e.target.closest('.btn-add-option')) {
            const optionsContainer = e.target.closest('.field-preview').querySelector('.options-container');
            const optionCount = optionsContainer.querySelectorAll('.option-row').length + 1;
            
            // Seçenek tipi (ikon için)
            const type = optionsContainer.getAttribute('data-type');
            const iconClass = type === 'checkbox' ? 'bi-square' : 'bi-circle';

            const newOptionHTML = `
                <div class="d-flex align-items-center mb-2 option-row">
                    <i class="bi ${iconClass} me-2 text-muted"></i>
                    <input type="text" class="form-control form-control-sm border-bottom-only w-50 option-input" value="Seçenek ${optionCount}">
                    <button type="button" class="btn btn-link text-danger btn-sm btn-remove-option px-2"><i class="bi bi-x-lg"></i></button>
                </div>
            `;
            optionsContainer.insertAdjacentHTML('beforeend', newOptionHTML);
        }
    });

    // Canvas'a yeni soru ekleyen fonksiyon
    function addFieldToCanvas(type) {
        const uniqueId = 'field_' + Math.random().toString(36).substr(2, 9);
        const wrapper = document.createElement('div');
        wrapper.className = 'card mb-4 field-wrapper bg-white';
        wrapper.id = uniqueId;

        let previewHTML = '';
        let typeName = '';

        // Dinamik seçenekler için HTML iskeleti oluşturan yardımcı fonksiyon
        const generateOptionsHTML = (inputType) => {
            const iconClass = inputType === 'checkbox' ? 'bi-square' : 'bi-circle';
            return `
                <div class="options-container" data-type="${inputType}">
                    <div class="d-flex align-items-center mb-2 option-row">
                        <i class="bi ${iconClass} me-2 text-muted"></i>
                        <input type="text" class="form-control form-control-sm border-bottom-only w-50 option-input" value="Seçenek 1">
                        <button type="button" class="btn btn-link text-danger btn-sm btn-remove-option px-2"><i class="bi bi-x-lg"></i></button>
                    </div>
                </div>
                <div class="mt-2">
                    <button type="button" class="btn btn-link btn-sm text-decoration-none btn-add-option p-0">
                        <i class="bi bi-plus-lg"></i> Yeni Seçenek Ekle
                    </button>
                </div>
            `;
        };

        switch (type) {
            case 'text':
                typeName = 'Kısa Metin';
                previewHTML = `<input type="text" class="form-control" placeholder="Kısa yanıt metni..." disabled>`;
                break;
            case 'textarea':
                typeName = 'Uzun Metin';
                previewHTML = `<textarea class="form-control" rows="3" placeholder="Uzun yanıt metni..." disabled></textarea>`;
                break;
            case 'select':
                typeName = 'Açılır Liste';
                previewHTML = generateOptionsHTML('select');
                break;
            case 'checkbox':
                typeName = 'Onay Kutusu';
                previewHTML = generateOptionsHTML('checkbox');
                break;
        }

        wrapper.innerHTML = `
            <div class="card-body">
                <div class="row mb-3 align-items-center">
                    <div class="col-md-8">
                        <input type="text" class="form-control form-control-lg border-bottom-only fw-semibold question-title" placeholder="Sorunuzu buraya yazın">
                    </div>
                    <div class="col-md-4 text-end">
                        <span class="badge bg-secondary text-light fw-normal p-2"><i class="bi bi-info-circle"></i> ${typeName}</span>
                    </div>
                </div>
                
                <div class="field-preview px-2 pb-3">
                    ${previewHTML}
                </div>

                <hr class="text-muted mt-0 mb-3">
                
                <div class="d-flex justify-content-end align-items-center">
                    <div class="form-check form-switch me-3">
                        <input class="form-check-input required-switch" type="checkbox" id="req_${uniqueId}">
                        <label class="form-check-label text-muted small" for="req_${uniqueId}">Zorunlu</label>
                    </div>
                    <button type="button" class="btn btn-outline-danger btn-sm btn-delete-field">
                        <i class="bi bi-trash3"></i> Sil
                    </button>
                </div>
            </div>
        `;

        // Soruyu komple silme
        wrapper.querySelector('.btn-delete-field').addEventListener('click', function() {
            wrapper.remove();
        });

        fieldsContainer.appendChild(wrapper);
        wrapper.querySelector('.question-title').focus();
    }
});
  </script>

</body>
</html>
