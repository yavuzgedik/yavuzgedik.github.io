<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssemblyAI Türkçe Real-Time</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #transcript {
            height: 300px;
            overflow-y: auto;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1rem;
        }
        .partial { color: #6c757d; font-style: italic; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-online { background-color: #28a745; }
        .status-offline { background-color: #dc3545; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">AssemblyAI Türkçe Canlı STT</h5>
                    <span id="connectionStatus"><span class="status-dot status-offline"></span>Bağlı Değil</span>
                </div>
                <div class="card-body">
                    
                    <div class="mb-3">
                        <label class="form-label">AssemblyAI API Key</label>
                        <input type="password" id="apiKey" class="form-control" placeholder="API Anahtarınızı buraya yapıştırın">
                        <div class="form-text">Anahtarınızı <a href="https://www.assemblyai.com/app" target="_blank">Dashboard</a> üzerinden alabilirsiniz.</div>
                    </div>

                    <div class="d-grid gap-2 d-md-block mb-3">
                        <button id="startBtn" class="btn btn-success px-4">Kaydı Başlat</button>
                        <button id="stopBtn" class="btn btn-danger px-4" disabled>Durdur</button>
                    </div>

                    <h6>Transkripsiyon:</h6>
                    <div id="transcript" class="mb-3 text-monospace text-dark"></div>
                    
                    <div id="errorMessage" class="alert alert-danger d-none"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let socket;
    let audioContext;
    let processor;
    let stream;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const transcriptDiv = document.getElementById('transcript');
    const statusLabel = document.getElementById('connectionStatus');
    const apiKeyInput = document.getElementById('apiKey');
    const errorMsg = document.getElementById('errorMessage');

    const updateStatus = (online) => {
        statusLabel.innerHTML = online 
            ? '<span class="status-dot status-online"></span>Bağlantı Aktif' 
            : '<span class="status-dot status-offline"></span>Bağlı Değil';
    };

    startBtn.onclick = async () => {
        const API_KEY = apiKeyInput.value.trim();
        if (!API_KEY) {
            alert("Lütfen geçerli bir API Key girin!");
            return;
        }

        errorMsg.classList.add('d-none');
        transcriptDiv.innerHTML = "";

        try {
            // 1. Mikrofon Erişimi
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            // 2. Audio Context Kurulumu (16kHz AssemblyAI için idealdir)
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const source = audioContext.createMediaStreamSource(stream);
            processor = audioContext.createScriptProcessor(4096, 1, 1);

            // 3. WebSocket Bağlantısı (Parametre olarak API Key gönderimi)
            // v3 streaming'de auth_token query param olarak da gönderilebilir
            socket = new WebSocket(`wss://streaming.assemblyai.com/v3/ws?sample_rate=16000&speech_model=whisper-rt&token=${API_KEY}`);

            socket.onopen = () => {
                updateStatus(true);
                startBtn.disabled = true;
                stopBtn.disabled = false;
                console.log("WebSocket açıldı.");
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.error) {
                    showError("Hata: " + data.error);
                    stopRecording();
                    return;
                }

                if (data.text) {
                    if (data.message_type === 'FinalTranscript') {
                        const p = document.createElement('div');
                        p.className = "mb-1 fw-bold text-primary";
                        p.innerText = "➜ " + data.text;
                        transcriptDiv.appendChild(p);
                        // Varsa geçici metni temizle
                        const oldPartial = document.querySelector('.partial');
                        if (oldPartial) oldPartial.remove();
                    } else {
                        // Partial (anlık) sonuçlar
                        let partialSpan = document.querySelector('.partial');
                        if (!partialSpan) {
                            partialSpan = document.createElement('span');
                            partialSpan.className = 'partial';
                            transcriptDiv.appendChild(partialSpan);
                        }
                        partialSpan.innerText = " " + data.text;
                    }
                    transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
                }
            };

            socket.onerror = (e) => {
                showError("Bağlantı hatası oluştu. Lütfen API anahtarınızı kontrol edin.");
                console.error(e);
            };

            socket.onclose = (e) => {
                console.log(`Bağlantı kapandı: ${e.code} ${e.reason}`);
                updateStatus(false);
                stopRecording();
            };

            // 4. Sesi PCM formatına çevirip gönderme
            processor.onaudioprocess = (e) => {
                if (socket.readyState !== WebSocket.OPEN) return;

                const inputData = e.inputBuffer.getChannelData(0);
                const pcmData = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    pcmData[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                }
                
                const base64Audio = btoa(String.fromCharCode(...new Uint8Array(pcmData.buffer)));
                socket.send(JSON.stringify({ audio_data: base64Audio }));
            };

            source.connect(processor);
            processor.connect(audioContext.destination);

        } catch (err) {
            showError("Mikrofon izni reddedildi veya cihaz bulunamadı.");
            console.error(err);
        }
    };

    stopBtn.onclick = () => stopRecording();

    function stopRecording() {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ terminate_session: true }));
            socket.close();
        }
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        if (audioContext) {
            audioContext.close();
        }
        startBtn.disabled = false;
        stopBtn.disabled = true;
        updateStatus(false);
    }

    function showError(msg) {
        errorMsg.innerText = msg;
        errorMsg.classList.remove('d-none');
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
