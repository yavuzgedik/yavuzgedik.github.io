<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssemblyAI Türkçe Real-Time</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #transcript { height: 350px; overflow-y: auto; background: white; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; }
        .partial { color: #6c757d; font-style: italic; }
        .final { color: #0d6efd; font-weight: bold; display: block; margin-bottom: 8px; border-bottom: 1px solid #f0f0f0; padding-bottom: 4px; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h5 class="mb-0">Türkçe Sesli Komut Testi (v3)</h5>
                </div>
                <div class="card-body p-4">
                    <div class="input-group mb-3">
                        <input type="password" id="apiKey" class="form-control" placeholder="AssemblyAI API Key Yapıştırın">
                        <button id="startBtn" class="btn btn-success px-4">Başlat</button>
                        <button id="stopBtn" class="btn btn-danger px-4" disabled>Durdur</button>
                    </div>

                    <div id="status" class="alert alert-secondary py-2 text-center">Durum: Hazır</div>
                    
                    <div id="transcript" class="shadow-sm"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let socket;
    let audioContext;
    let processor;
    let stream;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const transcriptDiv = document.getElementById('transcript');
    const statusDiv = document.getElementById('status');
    const apiKeyInput = document.getElementById('apiKey');

    // Güvenli Base64 Dönüştürücü
    function bufferToBase64(buffer) {
        let binary = '';
        const bytes = new Uint8Array(buffer);
        for (let i = 0; i < bytes.byteLength; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return window.btoa(binary);
    }

    startBtn.onclick = async () => {
        const key = apiKeyInput.value.trim();
        if(!key) return alert("Lütfen API Key girin!");

        try {
            statusDiv.innerText = "Mikrofon bağlanıyor...";
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            // Audio Context başlat
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const source = audioContext.createMediaStreamSource(stream);
            processor = audioContext.createScriptProcessor(4096, 1, 1);

            // WebSocket Bağlantısı (Parametreler URL içinde)
            const url = `wss://streaming.assemblyai.com/v3/ws?sample_rate=16000&speech_model=whisper-rt&token=${key}`;
            socket = new WebSocket(url);

            socket.onopen = () => {
                statusDiv.innerText = "Bağlantı Aktif - Konuşabilirsiniz";
                statusDiv.className = "alert alert-success py-2 text-center";
                startBtn.disabled = true;
                stopBtn.disabled = false;
            };

            socket.onmessage = (event) => {
                const response = JSON.parse(event.data);
                
                if (response.error) {
                    console.error("Hata Mesajı:", response.error);
                    return;
                }

                if (response.text) {
                    if (response.message_type === "FinalTranscript") {
                        const div = document.createElement('div');
                        div.className = "final";
                        div.innerText = response.text;
                        transcriptDiv.appendChild(div);
                        // Geçici metni temizle
                        const p = document.querySelector('.partial');
                        if (p) p.remove();
                    } else {
                        let p = document.querySelector('.partial');
                        if (!p) {
                            p = document.createElement('span');
                            p.className = "partial";
                            transcriptDiv.appendChild(p);
                        }
                        p.innerText = " " + response.text;
                    }
                    transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
                }
            };

            socket.onclose = (e) => {
                console.warn(`Soket Kapandı. Kod: ${e.code}, Neden: ${e.reason}`);
                stopRecording();
            };

            socket.onerror = (err) => {
                console.error("WebSocket Hatası:", err);
            };

            // Ses verisini yakala ve gönder
            processor.onaudioprocess = (e) => {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    const inputData = e.inputBuffer.getChannelData(0);
                    const pcmData = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        pcmData[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                    }
                    
                    const base64Audio = bufferToBase64(pcmData.buffer);
                    // Sadece audio_data içeren temiz bir JSON gönder
                    if (base64Audio) {
                        socket.send(JSON.stringify({ audio_data: base64Audio }));
                    }
                }
            };

            source.connect(processor);
            processor.connect(audioContext.destination);

        } catch (err) {
            console.error("Başlatma hatası:", err);
            alert("Bağlantı hatası: " + err.message);
        }
    };

    function stopRecording() {
        if (socket) {
            if(socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ terminate_session: true }));
            }
            socket.close();
        }
        if (stream) stream.getTracks().forEach(t => t.stop());
        if (audioContext) audioContext.close();
        
        startBtn.disabled = false;
        stopBtn.disabled = true;
        statusDiv.innerText = "Bağlantı Kesildi";
        statusDiv.className = "alert alert-danger py-2 text-center";
    }

    stopBtn.onclick = stopRecording;
</script>

</body>
</html>
