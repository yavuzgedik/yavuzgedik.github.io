<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssemblyAI - Hata Ayıklama Modu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #transcript { height: 300px; overflow-y: auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 15px; }
        .partial { color: #888; font-style: italic; }
        .final { color: #0d6efd; font-weight: bold; margin-bottom: 5px; display: block; }
        .log-error { color: #dc3545; font-family: monospace; font-size: 0.85rem; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="text-center mb-4">Türkçe Canlı STT (Hata Ayıklama)</h5>
                    
                    <div class="input-group mb-3">
                        <input type="password" id="apiKey" class="form-control" placeholder="API Key">
                        <button id="startBtn" class="btn btn-primary">Başlat</button>
                        <button id="stopBtn" class="btn btn-danger" disabled>Durdur</button>
                    </div>

                    <div id="status" class="alert alert-secondary py-1 text-center small">Hazır</div>
                    
                    <div id="transcript" class="mb-3"></div>
                    
                    <div id="errorLogs" class="p-2 bg-dark text-warning rounded d-none" style="max-height: 100px; overflow: auto;">
                        <strong>Sistem Mesajı:</strong> <span id="errorText"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const workletCode = `
        class AudioProcessor extends AudioWorkletProcessor {
            process(inputs) {
                const input = inputs[0][0];
                if (input) {
                    const pcmData = new Int16Array(input.length);
                    for (let i = 0; i < input.length; i++) {
                        pcmData[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;
                    }
                    this.port.postMessage(pcmData.buffer);
                }
                return true;
            }
        }
        registerProcessor('audio-processor', AudioProcessor);
    `;

    let socket, audioContext, stream, workletNode;
    let isSessionActive = false; // Oturum onaylandı mı?

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusDiv = document.getElementById('status');
    const transcriptDiv = document.getElementById('transcript');
    const errorLogs = document.getElementById('errorLogs');
    const errorText = document.getElementById('errorText');

    function logError(msg) {
        errorLogs.classList.remove('d-none');
        errorText.innerText = msg;
    }

    startBtn.onclick = async () => {
        const key = document.getElementById('apiKey').value.trim();
        if(!key) return alert("Lütfen API Key girin!");

        errorLogs.classList.add('d-none');
        isSessionActive = false;

        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioContext = new AudioContext({ sampleRate: 16000 });

            const blob = new Blob([workletCode], { type: 'application/javascript' });
            const workletUrl = URL.createObjectURL(blob);
            await audioContext.audioWorklet.addModule(workletUrl);

            // ÖNEMLİ: URL yapısını v3 standartlarına tam uygun hale getirdik
            const wsUrl = `wss://streaming.assemblyai.com/v3/ws?sample_rate=16000&speech_model=whisper-rt&token=${key}`;
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                statusDiv.innerText = "Soket Açıldı, Oturum Bekleniyor...";
                statusDiv.className = "alert alert-warning py-1 text-center small";
            };

            socket.onmessage = (event) => {
                const res = JSON.parse(event.data);

                // Sunucu hata gönderirse yakala
                if (res.error) {
                    logError("Sunucu Hatası: " + res.error);
                    return;
                }

                // Oturum başladığında sesi akıtmaya başla
                if (res.message_type === "SessionBegins") {
                    isSessionActive = true;
                    statusDiv.innerText = "Oturum Başladı - Konuşabilirsiniz";
                    statusDiv.className = "alert alert-success py-1 text-center small";
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    startAudioFlow();
                }

                if (res.text) {
                    if (res.message_type === "FinalTranscript") {
                        const div = document.createElement('span');
                        div.className = "final";
                        div.innerText = res.text + " ";
                        transcriptDiv.appendChild(div);
                        if (document.querySelector('.partial')) document.querySelector('.partial').remove();
                    } else {
                        let p = document.querySelector('.partial') || document.createElement('span');
                        p.className = "partial";
                        p.innerText = res.text;
                        transcriptDiv.appendChild(p);
                    }
                    transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
                }
            };

            socket.onclose = (e) => {
                console.log("Kapandı:", e.code, e.reason);
                let reason = "Bilinmeyen hata.";
                if(e.code === 4001) reason = "Geçersiz API Key!";
                if(e.code === 4003) reason = "Ücretsiz limit dolmuş veya yetki yok.";
                if(e.code === 3006) reason = "Veri formatı hatası (3006).";
                
                logError(`Kapandı. Kod: ${e.code} - ${reason}`);
                stopRecording();
            };

            socket.onerror = (err) => logError("WebSocket Hatası!");

        } catch (err) {
            logError("Başlatma Hatası: " + err.message);
        }
    };

    function startAudioFlow() {
        const source = audioContext.createMediaStreamSource(stream);
        workletNode = new AudioWorkletNode(audioContext, 'audio-processor');
        
        workletNode.port.onmessage = (event) => {
            // SADECE oturum aktifse ve soket açıksa gönder
            if (isSessionActive && socket && socket.readyState === WebSocket.OPEN) {
                const base64Audio = btoa(String.fromCharCode(...new Uint8Array(event.data)));
                socket.send(JSON.stringify({ audio_data: base64Audio }));
            }
        };

        source.connect(workletNode);
        workletNode.connect(audioContext.destination);
    }

    function stopRecording() {
        isSessionActive = false;
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ terminate_session: true }));
            socket.close();
        }
        if (stream) stream.getTracks().forEach(t => t.stop());
        if (audioContext) audioContext.close();
        startBtn.disabled = false;
        stopBtn.disabled = true;
        statusDiv.innerText = "Durduruldu";
        statusDiv.className = "alert alert-danger py-1 text-center small";
    }

    stopBtn.onclick = stopRecording;
</script>
</body>
</html>
